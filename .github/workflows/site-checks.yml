name: NOD Site Quality
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site-checks.yml]
  pull_request:
    paths: [site/**, .github/workflows/site-checks.yml]
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node version
        run: node --version
      - name: Static security, navigation, claims and interaction contracts
        run: node --test site/tests/site.test.mjs
