; Piblo â€” firmware for M5Stack Cardputer ADV (StampS3A / ESP32-S3FN8)
[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_flags = --no-stub
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/version.py
; v0.8 uses the clearer phone-first portal_v3.cpp. Older portal implementations
; remain in history/source for rollback comparison but are not linked into firmware.
build_src_filter =
    +<*>
    -<net/portal.cpp>
    -<net/portal_v2.cpp>

board_build.embed_files = src/net/ca_bundle.bin

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Ifirmware/nod/include
    -std=gnu++17
    ; Nothing in src/ or the pinned libs throws or catches (an uncaught throw only aborts anyway), so
    ; the arduino-esp32 default -fexceptions was pure dead weight: -145,296 B of .eh_frame +
    ; landing pads in firmware.bin (1,490,896 -> 1,345,600). Do not add try/catch without removing this.
    -fno-exceptions
    -DWEBSOCKETS_TCP_TIMEOUT=800
    -Wl,--wrap=mbedtls_strerror
    -Wl,--wrap=mbedtls_ssl_handshake_server_step
    -Wl,--wrap=esp_core_dump_init
    -Wl,--wrap=esp_core_dump_write
build_unflags = -std=gnu++11

lib_deps =
    ; 0.2.20 fixes 16-bit PCM sample pair order on I2S HW v2 (ESP32-S3): mono
    ; 16 kHz output had fs/2 image noise (upstream commit 1fd73f3e) - the main
    ; Cardputer ADV playback distortion. It also brings the CardputerADV-specific
    ; ES8311 mic bulk (ADC vol 0xBF instead of the shared +32 dB 0xFF) and the
    ; speaker handoff / lazy-begin race fixes. Needs M5GFX >= 0.2.27.
    ; Deliberately NOT 0.2.22: its Mic serialization (#351) + corrected playRaw
    ; return are worth taking later, but cost ~22 KB flash (1,505,290 vs
    ; 1,483,641 here) and the OTA app slot budget is 1,507,328.
    m5stack/M5Unified@0.2.20
    ; Git URL + tag on purpose: M5Unified declares ">=0.2.27" with no cap, and
    ; PIO's solver then overrides registry pins and installs the newest M5GFX
    ; (0.3.0), which changes setRotation() semantics. A URL+tag spec is exact.
    https://github.com/m5stack/M5GFX.git#0.2.27
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1

; Piblo is a Launcher-managed app image. Generic ArduinoOTA remains off:
; M5Launcher owns installation/rollback while Piblo owns Wi-Fi provisioning,
; MAZ Core, live screen and normal device control inside its app boundary.
