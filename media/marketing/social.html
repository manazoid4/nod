<!doctype html><meta charset=utf-8><title>Nod social graphic 1080x1080, Flip and Slide concepts</title><link rel=stylesheet href=brand.css>
<style>body{--w:1080px;--h:1080px;background:var(--sun)}
.logo{position:absolute;left:64px;top:56px}
h2{position:absolute;left:64px;top:170px;font-size:104px;width:900px}
.card{position:absolute;top:470px;width:440px;height:430px;background:var(--paper);border:5px solid var(--ink);border-radius:36px;box-shadow:0 10px 0 var(--ink);overflow:hidden}
.card h3{position:absolute;left:30px;bottom:26px;font-size:44px}
.card .tag{position:absolute;right:16px;top:16px;font-size:17px}
.c1{left:64px}.c2{left:576px}
.flipdeck{left:50px;top:215px;width:340px;height:110px}.flipdeck .keys{inset:18px}
.flip{left:70px;top:70px;width:300px;height:170px;z-index:2}.flip .scr{inset:14px}
.slkeys{left:85px;top:240px;width:270px;height:110px}.slkeys .keys{inset:14px}
.sl{left:70px;top:70px;width:300px;height:190px;z-index:2}.sl .scr{inset:14px 14px 70px}
.fine{position:absolute;left:64px;bottom:52px;width:950px;font-size:22px;color:var(--ink);font-weight:700}</style>
<body><span class=logo><i></i>nod</span>
<h2>Where could Nod go next?</h2>
<div class="card c1"><span class=tag>Concept</span>
 <div class="cn flipdeck"><div class=keys></div></div><div class="cn flip"><div class=scr></div></div><h3>Nod Flip</h3></div>
<div class="card c2"><span class=tag>Concept</span>
 <div class="cn slkeys"><div class=keys></div></div><div class="cn sl"><div class=scr></div></div><h3>Nod Slide</h3></div>
<p class=fine>Design concepts only. Not prototyped, costed or scheduled. Today's Nod is built on a Cardputer ADV.</p>
